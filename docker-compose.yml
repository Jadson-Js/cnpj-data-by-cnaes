services:
  postgres:
    image: postgres:16
    container_name: rfb_cnpj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Dados_RFB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Dados_RFB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
